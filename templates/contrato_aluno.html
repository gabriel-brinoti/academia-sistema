<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Contrato - DL Fit</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icon-180.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    <meta name="theme-color" content="#111111">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="login-box">
    <div class="logo-center">
        <img src="{{ url_for('static', filename='logo-dlfit.jpg') }}" alt="Logo DL Fit">
    </div>

    <h1 class="section-title">Contrato e Termos de Uso</h1>

    <p class="subtitulo">
        Para continuar com o agendamento, leia e aceite os termos da academia.
    </p>

    <div style="text-align:left; max-height:350px; overflow:auto; border:1px solid #ddd; padding:15px; border-radius:10px; margin-bottom:20px;">

    <p>
        Para continuar utilizando o sistema da academia, leia e aceite os termos do contrato.
    </p>

    <a href="{{ url_for('static', filename='contrato_dlfit.pdf') }}"
       target="_blank"
       class="btn">
       Ver contrato completo
    </a>

</div>

    <form method="POST" action="{{ url_for('aceitar_contrato') }}">
        <button type="submit">Li e concordo</button>
    </form>

    <div class="footer-actions">
        <a href="{{ url_for('cronograma') }}" class="btn-voltar">Voltar</a>
    </div>
</div>
</body>
</html>
