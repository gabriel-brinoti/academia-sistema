<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Aluno - DL Fit</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icon-180.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    <meta name="theme-color" content="#111111">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="navbar">
    <div class="navbar-brand">
        <img src="{{ url_for('static', filename='logo-dlfit.jpg') }}" alt="Logo DL Fit">
        <h1>DL Fit Admin</h1>
    </div>
    <div class="navbar-links">
        <a href="{{ url_for('alunos') }}">Alunos</a>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
    </div>
</div>

<div class="form-box">
    <h1 class="section-title">Editar Aluno</h1>
    <p class="subtitulo">Atualize os dados do aluno</p>
    <form method="POST">
        <label>Nome completo:</label>
<input type="text" name="nome" value="{{ aluno.nome }}" required>

<label>Telefone:</label>
<input type="text" name="telefone" value="{{ aluno.telefone }}">

<label>Tipo de plano:</label>
<input type="text" name="plano" list="lista_planos" value="{{ aluno.plano or '' }}" placeholder="SELECIONE OU DIGITE">
<datalist id="lista_planos">
    <option value="MENSAL">
    <option value="SEMESTRAL">
    <option value="ANUAL">
    <option value="CLUBE MAIS 12">
    <option value="CLUBE MAIS 15">
    <option value="WELLHUB">
    <option value="TOTALPASS">
</datalist>

<label>Quantidade total de aulas:</label>
<input type="number" name="aulas_contratadas" value="{{ aluno.aulas_contratadas or '' }}">

<label>Data de nascimento:</label>
<input type="date" name="data_nascimento" value="{{ aluno.data_nascimento }}">

<label>Data de início:</label>
<input type="date" name="data_inicio" value="{{ aluno.data_inicio }}">

<label>Data de vencimento:</label>
<input type="date" name="vencimento" value="{{ aluno.vencimento }}">

<label>Aulas já utilizadas antes do sistema:</label>
<input type="number" name="aulas_usadas_iniciais" value="{{ aluno.aulas_usadas_iniciais or 0 }}">

<label>Frequência:</label>
<select name="frequencia">
    <option value="">SELECIONE</option>

    <option value="1x_semana" {% if aluno.frequencia == '1x_semana' %}selected{% endif %}>1X POR SEMANA</option>

    <option value="2x_semana" {% if aluno.frequencia == '2x_semana' %}selected{% endif %}>2X POR SEMANA</option>

    <option value="3x_semana" {% if aluno.frequencia == '3x_semana' %}selected{% endif %}>3X POR SEMANA</option>

    <option value="4x_semana" {% if aluno.frequencia == '4x_semana' %}selected{% endif %}>4X POR SEMANA</option>

    <option value="5x_semana" {% if aluno.frequencia == '5x_semana' %}selected{% endif %}>5X POR SEMANA</option>

    <option value="1x_dia" {% if aluno.frequencia == '1x_dia' %}selected{% endif %}>1X POR DIA</option>

    <option value="2x_dia" {% if aluno.frequencia == '2x_dia' %}selected{% endif %}>2X POR DIA</option>
</select>
        <label>Status do pagamento</label>
        <select name="status_pagamento">
            <option value="" {% if not aluno.status_pagamento %}selected{% endif %}>SELECIONE</option>
            <option value="Pago" {% if aluno.status_pagamento == 'Pago' %}selected{% endif %}>PAGO</option>
            <option value="Pendente" {% if aluno.status_pagamento == 'Pendente' %}selected{% endif %}>PENDENTE</option>
            <option value="Atrasado" {% if aluno.status_pagamento == 'Atrasado' %}selected{% endif %}>ATRASADO</option>
        </select>
        <textarea name="observacao" placeholder="Observações">{{ aluno.observacao }}</textarea>
        <button type="submit">Atualizar</button>
    </form>
    <div class="footer-actions">
        <a href="{{ url_for('alunos') }}" class="btn-voltar">Voltar</a>
    </div>
</div>
</body>
</html>
